name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full test suite (Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-dev.txt \
            -r requirements-langchain.txt \
            -r requirements-openai.txt
          python -m pip check

      - name: Compile source without warnings
        run: |
          python -W error -m compileall -q src scripts tests

      - name: Run tests
        env:
          EMBEDDING_PROVIDER: mock
          API_AUTH_ENABLED: "false"
          REQUEST_RATE_LIMIT_ENABLED: "false"
          TOKEN_QUOTA_ENABLED: "false"
        run: |
          pytest -q

  docker-smoke:
    name: Docker release smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and wait for healthy container
        run: |
          docker compose up \
            --build \
            --detach \
            --wait \
            --wait-timeout 180

      - name: Verify native and OpenAI-compatible contracts
        run: |
          python scripts/docker_smoke_test.py \
            --base-url http://127.0.0.1:8000 \
            --wait-timeout-seconds 30

      - name: Verify Docker health status
        run: |
          container_id="$(docker compose ps -q chat-api)"
          test -n "${container_id}"
          test "$(docker inspect \
            --format='{{.State.Health.Status}}' \
            "${container_id}")" = "healthy"

      - name: Diagnostics and cleanup
        if: always()
        run: |
          docker compose ps || true
          docker compose logs \
            --no-color \
            --tail=200 \
            chat-api || true
          docker compose down \
            --volumes \
            --remove-orphans || true
